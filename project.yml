name: WarmasterStudio
options:
  bundleIdPrefix: com.warmasterstudio
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15"
settings:
  SWIFT_VERSION: "5.9"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  WarmasterStudio:
    type: application
    platform: macOS
    sources:
      - path: Sources/WarmasterStudio
        excludes:
          - Info.plist
    info:
      path: Sources/WarmasterStudio/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.warmasterstudio.app
      INFOPLIST_FILE: Sources/WarmasterStudio/Info.plist
      SWIFT_VERSION: "5.9"
      COMBINE_HIDPI_IMAGES: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_STYLE: Automatic
  WarmasterStudioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/WarmasterStudioTests
    dependencies:
      - target: WarmasterStudio
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.warmasterstudio.tests
      SWIFT_VERSION: "5.9"
  WarmasterStudioUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/WarmasterStudioUITests
    dependencies:
      - target: WarmasterStudio
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.warmasterstudio.uitests
      SWIFT_VERSION: "5.9"
      GENERATE_INFOPLIST_FILE: YES
